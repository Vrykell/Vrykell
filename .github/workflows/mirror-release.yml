name: Mirror release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to mirror
        required: true
        default: v0.1.9
        type: string
permissions:
  contents: read
concurrency:
  group: mirror-release-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  mirror:
    name: Release mirror (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        host: [gitee, atomgit]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - name: Mirror release and binary attachments
        env:
          GH_TOKEN: ${{ github.token }}
          MIRROR_TOKEN: ${{ matrix.host == 'gitee' && secrets.GITEE_TOKEN || secrets.ATOMGIT_TOKEN }}
          MIRROR_HOST: ${{ matrix.host }}
          MIRROR_USE_CURL: 'true'
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo Vrykell/Vrykell --json name,body,tagName,targetCommitish,assets > release.json
          gh release download "$TAG" --repo Vrykell/Vrykell --dir release-assets
          node scripts/mirror-release.mjs
