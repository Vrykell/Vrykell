name: Release signed updates

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Stable tag matching all application version files'
        type: string
        required: true
      publish:
        description: 'Publish after every signed platform is verified'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: signed-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - run: node --test scripts/__tests__/update-release.test.mjs scripts/__tests__/finalize-update-manifest.test.mjs
      - run: node scripts/validate-update-release.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          test -n "$SIGNING_KEY" || { echo 'Configure the update signing secret before releasing'; exit 1; }
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > "$RUNNER_TEMP/release-draft"; then
            test "$(cat "$RUNNER_TEMP/release-draft")" = true || { echo 'Published releases cannot be overwritten'; exit 1; }
            test "$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)" = "$GITHUB_SHA" || { echo 'Use the original draft commit or a new version'; exit 1; }
          else
            if gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha > "$RUNNER_TEMP/tag-commit" 2>/dev/null; then
              test "$(cat "$RUNNER_TEMP/tag-commit")" = "$GITHUB_SHA" || { echo 'The existing tag belongs to a different commit'; exit 1; }
            fi
            gh release create "$RELEASE_TAG" --draft --target "$GITHUB_SHA" --title "Vrykell $RELEASE_TAG" --generate-notes
          fi
          echo "id=$(gh release view "$RELEASE_TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a
        with:
          workspaces: src-tauri -> target
          shared-key: updates-${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2
      - run: npm ci
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.prepare.outputs.release }}
          tagName: ${{ inputs.tag }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          tauriScript: npm run tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Build portable Windows archive without updates
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          VITE_DISABLE_UPDATES: 'true'
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          npm run tauri -- build --ci --target x86_64-pc-windows-msvc --no-bundle --features portable --config src-tauri/tauri.portable.conf.json -- --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $stage = Join-Path $env:RUNNER_TEMP 'portable'
          New-Item -ItemType Directory -Path "$stage/legal/fonts" -Force | Out-Null
          Copy-Item 'src-tauri/target/x86_64-pc-windows-msvc/release/vrykell.exe' "$stage/Vrykell.exe"
          Copy-Item 'LICENSE', 'NOTICE', 'public/legal/THIRD_PARTY_NOTICES.txt' "$stage/legal/"
          Copy-Item 'public/fonts/*-OFL.txt' "$stage/legal/fonts/"
          $archive = Join-Path $env:RUNNER_TEMP "Vrykell_$($env:RELEASE_TAG.Substring(1))_x64-portable.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive
          gh release upload $env:RELEASE_TAG $archive --clobber

  verify:
    needs: [prepare, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
      - env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --pattern latest.json --dir "$RUNNER_TEMP"
          gh api "repos/$GITHUB_REPOSITORY/releases/${{ needs.prepare.outputs.release }}" > "$RUNNER_TEMP/release.json"
          node scripts/finalize-update-manifest.mjs "$RUNNER_TEMP/latest.json" "$RUNNER_TEMP/release.json"
          node scripts/validate-update-release.mjs "$RUNNER_TEMP/latest.json"
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/latest.json" --clobber
      - if: inputs.publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
