name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'README*.md', 'CONTRIBUTING*.md', '.github/**', 'scripts/capture-readme.mjs']
  pull_request:
    branches: [dev, main]
    paths-ignore: ['docs/**', 'README*.md', 'CONTRIBUTING*.md', '.github/**', 'scripts/capture-readme.mjs']
  workflow_dispatch:
    inputs:
      mode:
        description: 'Choose basic checks, full tests, or one installer'
        type: choice
        required: true
        default: basic
        options: [basic, full, package]
      target:
        description: 'Installer target (used only in package mode)'
        type: choice
        required: true
        default: x86_64-pc-windows-msvc
        options: [x86_64-pc-windows-msvc, x86_64-unknown-linux-gnu, aarch64-apple-darwin, x86_64-apple-darwin]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run test -- --maxWorkers=4 --testTimeout=15000
      - run: npm run check:architecture
      - run: npm run build

  e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    name: Browser interaction tests (${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --reporter=line
      - name: Save failure diagnostics
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-test-results-${{ matrix.shard }}
          path: test-results/
          retention-days: 3
          if-no-files-found: ignore

  backend:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
    name: Backend tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [windows-2022, ubuntu-22.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          shared-key: tests-${{ matrix.os }}
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev xvfb
      - run: npm ci
      - name: Prepare and test native context menu
        if: runner.os == 'Windows'
        run: npm run windows:context-menu:prepare -- --test
      - name: Check third-party inventory
        if: runner.os == 'Windows'
        run: npm run licenses:check
      - name: Run backend tests
        if: runner.os != 'Linux'
        working-directory: src-tauri
        run: cargo test --locked -- --test-threads=1
      - name: Run backend tests with a display
        if: runner.os == 'Linux'
        working-directory: src-tauri
        run: xvfb-run -a cargo test --locked -- --test-threads=1

  packages:
    name: Package (${{ matrix.target }})
    needs: [frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.mode == 'package'
    strategy:
      fail-fast: false
      matrix:
        target: ['${{ inputs.target }}']
    runs-on: ${{ fromJSON('{"x86_64-pc-windows-msvc":"windows-2022","x86_64-unknown-linux-gnu":"ubuntu-22.04","aarch64-apple-darwin":"macos-15","x86_64-apple-darwin":"macos-15"}')[matrix.target] }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri -> target
          shared-key: packages-${{ matrix.target }}
      - name: Install native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libfuse2
      - run: npm ci
      - name: Build installers from main
        run: npm run tauri -- build --ci --target ${{ matrix.target }} --bundles ${{ fromJSON('{"x86_64-pc-windows-msvc":"nsis","x86_64-unknown-linux-gnu":"deb,appimage","aarch64-apple-darwin":"dmg","x86_64-apple-darwin":"dmg"}')[matrix.target] }} -- --locked
      - name: Save installers
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vrykell-${{ matrix.target }}-${{ github.sha }}
          path: |
            ${{ fromJSON('{"x86_64-pc-windows-msvc":"src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe","x86_64-unknown-linux-gnu":"src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb","aarch64-apple-darwin":"src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg","x86_64-apple-darwin":"src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg"}')[matrix.target] }}
            ${{ matrix.target == 'x86_64-unknown-linux-gnu' && 'src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage' || '' }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
