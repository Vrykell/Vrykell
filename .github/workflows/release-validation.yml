name: Release validation follow-up

on:
  push:
    branches: [codex/release-validation]

permissions:
  contents: read

jobs:
  browser:
    name: Corrected browser and update manifest coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test scripts/__tests__/update-release.test.mjs scripts/__tests__/finalize-update-manifest.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/running-term.spec.ts e2e/running-terminal-usability.spec.ts e2e/workspace-ai-utilities.spec.ts e2e/workspace-refinements.spec.ts --grep "context menu|AI utility pages|prefix cards" --reporter=line
