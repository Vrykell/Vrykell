name: Bug report / 问题反馈
description: Report a reproducible problem. 中文或英文均可。
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the project. Search existing issues first.
        Remove credentials and private information from all attachments.
        For suspected vulnerabilities, follow SECURITY.md instead of posting details here.
  - type: input
    id: version
    attributes:
      label: Version or commit / 版本或提交
      placeholder: "0.1.0, or a commit SHA"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform / 平台
      options: [Windows, macOS, Linux]
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment / 环境
      description: OS version, architecture, shell and relevant connection or model type. Do not include secrets.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction / 复现步骤
      description: Start from a known state and give the smallest sequence that reproduces the problem.
      placeholder: "1. Open ...\n2. Run ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots and diagnostics / 截图与诊断
      description: Add relevant redacted output, screenshots or recordings. Inspect files before uploading.
