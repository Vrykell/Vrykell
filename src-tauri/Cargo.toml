[package]
name = "vrykell"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vrykell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.31", features = ["bundled"] }
ignore = "0.4"
regex = "1"
dirs = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
url = "2"
tokio = { version = "1", features = ["process", "io-util", "sync", "time", "macros", "rt", "fs", "net"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
futures-util = "0.3"
base64 = "0.22"
ssh2 = "0.9"
zeroize = "1"
trash = "5"
tauri-plugin-drag = "2.1.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSUserDefaults", "NSString"] }
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# DPAPI for the local secret store: only the current user can unseal the values.
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }
# 进程树快照/终结（tlhelp32）、ConPTY 的 Ctrl+C/强杀路径，以及文件剪贴板（winuser/shellapi）
winapi = { version = "0.3", features = ["tlhelp32", "processthreadsapi", "handleapi", "minwinbase", "minwindef", "winnt", "winbase", "winuser", "shellapi"] }
