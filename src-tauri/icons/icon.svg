<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" fill="none">
  <title>Vrykell — Geometric Flat App Icon</title>
  <desc>Hand-constructed flat brand mark: three geometric components with two clipped color insets. No raster, filters, tracing, glow, or strokes. Source for the application icons; regenerate the bundle set with `npm run tauri -- icon src-tauri/icons/icon.svg`.</desc>

  <!-- The three module outlines are the single sources of truth for the silhouettes. -->
  <defs>
    <path id="left-body"
      d="M104.74 45
         H237.29
         A58 58 0 0 1 288.08 75
         L503.4 465.53
         A74.5 74.5 0 0 1 438.16 576
         H379.72
         A64.5 64.5 0 0 1 323.24 542.64
         L75.84 93.93
         A33 33 0 0 1 104.74 45 Z"/>
    <path id="upper-body"
      d="M500 41
         C483 41 466 54 466 72
         V110
         C466 125 472 136 485 145
         L591 210
         C541 246 498 289 474.72 322.87
         A28 28 0 0 0 473.18 352.08
         L529 455
         C537 470 547 469 556 455
         L710 228
         C726 205 724 185 704 171
         L520 47
         C513 43 506 41 500 41 Z"/>
    <clipPath id="left-crop"><use href="#left-body"/></clipPath>
    <clipPath id="upper-crop"><use href="#upper-body"/></clipPath>
  </defs>

  <!-- Square icon canvas: the original 800x620 artwork stays untouched and is centered vertically. -->
  <g transform="translate(0 90)">
    <!-- 01 | Geometric diagonal stem: one silhouette, two flat curved panels -->
    <g id="stem">
      <use href="#left-body" fill="#169AF0"/>
      <g clip-path="url(#left-crop)">
        <path id="stem-middle"
          d="M107 169
             C227 163 359 234 449 367
             C419 431 363 480 301 508
             L270 660 H-30 V164 Z"
          fill="#145BD9"/>
        <path id="stem-bottom"
          d="M449 367
             C419 431 363 480 301 508
             L347 660 H660 V360 Z"
          fill="#19349F"/>
      </g>
    </g>

    <!-- 02 | Angular upper ribbon, with a rounded outer turn -->
    <g id="prompt-chevron">
      <use href="#upper-body" fill="#089FDC"/>
      <g clip-path="url(#upper-crop)">
        <path id="chevron-cyan"
          d="M440 12 H651 V101
             C646 155 624 191 591 210
             L420 150 Z"
          fill="#14CADA"/>
        <path id="chevron-blue"
          d="M591 210
             C621 240 638 292 638 351
             L579 485 H454 L448 335
             C491 278 539 241 591 210 Z"
          fill="#0885CC"/>
      </g>
    </g>

    <!-- 03 | Secondary prompt cursor: flat angled capsule -->
    <path id="cursor"
      d="M617.9 420.3 H743.9
         C765.5 420.3 775.1 438.3 765.5 455.1
         L712.7 545.1
         C701.9 564.3 685.1 572.7 664.7 572.7
         H543.5
         C523.1 572.7 514.7 555.9 523.1 537.9
         L579.5 444.3
         C590.3 428.7 599.9 420.3 617.9 420.3 Z"
      fill="#08C9B0"/>
  </g>
</svg>
